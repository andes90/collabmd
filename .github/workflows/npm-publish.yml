name: NPM Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26.12.1'
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Validate release tag
        run: |
          expected_tag="v$(node -p 'require("./package.json").version')"

          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::NPM publishing must run from a tag, not $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi

          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package version $expected_tag"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Validate release candidate
        run: npm run check

      - name: Publish to NPM
        run: npm publish --access public
