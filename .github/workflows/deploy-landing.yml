name: Deploy Landing Page

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'landing/**'
      - 'src/client/styles/foundation/themes.css'
      - 'src/client/styles/surfaces/landing-page.css'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare standalone landing page
        run: |
          mkdir -p .tmp/landing
          cp -R landing/. .tmp/landing/
          cat src/client/styles/foundation/themes.css src/client/styles/surfaces/landing-page.css > .tmp/landing/styles.css

      - name: Upload landing page
        uses: actions/upload-pages-artifact@v4
        with:
          path: .tmp/landing

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
