<!DOCTYPE html>
<html lang="en" data-theme="light" data-surface="export-document">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CollabMD Export</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'><rect x='3' y='4' width='17' height='24' rx='3' stroke='%232563eb' stroke-width='2'/><rect x='12' y='4' width='17' height='24' rx='3' fill='%232563eb'/><path d='M17 12h7m-7 4h7m-7 4h4' stroke='white' stroke-width='1.5'/></svg>">
  <script vite-ignore defer src="./app-config.js"></script>
</head>
<body data-theme="light" data-surface="export-document">
  <main class="export-page-shell">
    <header class="export-page-header">
      <div>
        <h1>Preparing export</h1>
        <p id="exportStatus" role="status" aria-live="polite">Initializing…</p>
      </div>
    </header>
    <section id="exportWarningsSection" class="export-warnings-panel" hidden>
      <h2>Warnings</h2>
      <ul id="exportWarnings"></ul>
    </section>
    <article id="exportContent" class="preview-content export-content"></article>
  </main>
  <script type="module" src="./export-document-entry.js"></script>
</body>
</html>
